<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Details | Your Brand Fireworks</title>
<meta name="description" content="Your Brand Fireworks, Jaunpur — crackers, sparklers, fountains, sky shots and combo boxes for Diwali, weddings and every celebration since 2010.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Roboto:wght@300;400;500&amp;family=Lilita+One&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0612}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#FFB3BF}
.fw-nav{display:flex}
.fw-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:72px;align-items:center}
.fw-g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
input{box-sizing:border-box}
@media (max-width:1000px){.fw-split{grid-template-columns:minmax(0,1fr);gap:40px}.fw-g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.fw-nav{display:none}}
@keyframes fwToast{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.fw-toast{transform:translateX(-50%);animation:fwToast .3s ease both}
@keyframes fwPop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.fw-badge{animation:fwPop .35s ease}
.fw-step{display:flex;align-items:center;border-radius:999px;border:1.5px solid rgba(255,255,255,0.25);overflow:hidden}
.fw-step button{width:44px;height:44px;border:0;background:transparent;color:#FFFFFF;font-size:22px;cursor:pointer}
.fw-step button:hover{background:rgba(255,255,255,0.1)}
.fw-step span{min-width:36px;text-align:center;font-weight:700;font-size:18px}
@keyframes fwFade{from{opacity:0}to{opacity:1}}
@keyframes fwUp{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.fw-modal{animation:fwFade .25s ease both}
.fw-dialog{animation:fwUp .35s cubic-bezier(.2,.8,.2,1) both}
.fw-dialog input:focus,.fw-dialog textarea:focus{outline:2px solid #FFD166;outline-offset:1px}
@media (max-width:560px){.fw-enqform{grid-template-columns:minmax(0,1fr) !important}}
.fwh-nav{display:flex}
.fwh-burger{display:none}
.fwh-dd{position:relative}
.fwh-mega{position:absolute;top:100%;left:50%;padding-top:18px;transform:translateX(-50%) translateY(8px);opacity:0;visibility:hidden;transition:opacity .2s ease,transform .2s ease,visibility .2s;z-index:80}
.fwh-dd:hover .fwh-mega,.fwh-dd:focus-within .fwh-mega{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.fwh-dd:hover .fwh-chev,.fwh-dd:focus-within .fwh-chev{transform:rotate(180deg)}
.fwh-chev{transition:transform .2s ease}
.fwh-tile img{transition:transform .4s ease}.fwh-tile:hover img{transform:scale(1.08)}
.fwh-link{position:relative;padding:6px 0}
.fwh-link::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:#FF5A6E;transform:scaleX(0);transition:transform .25s ease}
.fwh-link:hover::after,.fwh-link[aria-current="page"]::after{transform:scaleX(1)}
@media (max-width:1280px){.fwh-enq{display:none !important}}
@media (max-width:1100px){.fwh-nav{display:none}.fwh-burger{display:flex}}
</style>
</head>
<body>

 hidden; background: #FFFFFF;"><img src="assets/images/garland-crackers.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="font-size: 15px; font-weight: 600;">Traditional</span></a><a href="fountains.html" class="fwh-tile" style="display: flex; flex-direction: column; gap: 8px; color: #FFFFFF;"><span style="display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #FFFFFF;"><img src="assets/images/golden-fountain.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="font-size: 15px; font-weight: 600;">Fountains</span></a><a href="category.html" class="fwh-tile" style="display: flex; flex-direction: column; gap: 8px; color: #FFFFFF;"><span style="display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #FFFFFF;"><img src="assets/images/sparkler-hand.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="font-size: 15px; font-weight: 600;">Sparklers</span></a><a href="eliteseries.html" class="fwh-tile" style="display: flex; flex-direction: column; gap: 8px; color: #FFFFFF;"><span style="display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #FFFFFF;"><img src="assets/images/golden-sky-burst.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="font-size: 15px; font-weight: 600;">Elite Series</span></a></div>
</div>
</div>
</div>
<a href="combos.html" class="fwh-link">Combo Boxes</a><a href="offers.html" class="fwh-link">Offers</a><a href="bulk.html" class="fwh-link">Bulk Orders</a><a href="gallery.html" class="fwh-link">Gallery</a><a href="contact.html" class="fwh-link">Contact</a>

<div class="fw-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; background: rgba(5,3,12,0.78);">
<button onClick="{{enqClose}}" aria-label="Close enquiry form" tabindex="-1" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: transparent; cursor: default;"></button>
<div role="dialog" aria-modal="true" aria-labelledby="fw-enq-title" class="fw-dialog" style="position: relative; width: 100%; max-width: 640px; max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 36px clamp(20px, 4vw, 40px); border-radius: 28px; background: linear-gradient(180deg, #1A0C2E, #100A28); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 30px 80px rgba(0,0,0,0.6); color: #F5F3FA; font-family: 'Roboto', system-ui, sans-serif;">
<button onClick="{{enqClose}}" aria-label="Close" style="position: absolute; top: 18px; right: 18px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<sc-if value="{{enqNotSent}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0 0 8px; font-size: 14px; letter-spacing: 4px; color: #FFD166;">GET IN TOUCH</p>
<h2 id="fw-enq-title" style="margin: 0 0 8px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 34px;">Send an Enquiry</h2>
<p style="margin: 0 0 24px; font-size: 17px; line-height: 1.5; color: #C9C3D8;">Tell us what you need and our team will call you back with prices and availability.</p>
<form onSubmit="{{enqSubmit}}" novalidate="" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;" class="fw-enqform">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8;">Full name <span style="color: #FF8A9B;">*</span><input type="text" value="{{enq.name}}" onChange="{{enqSet.name}}" placeholder="Your name" style="min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid {{enqErr.nameBorder}}; background: #0A0612; color: #FFFFFF; font-size: 16px; font-family: inherit; width: 100%; box-sizing: border-box;"><sc-if value="{{enqErr.name}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #FF8A9B;">{{enqErr.nameMsg}}</span></sc-if></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8;">Phone number <span style="color: #FF8A9B;">*</span><input type="tel" value="{{enq.phone}}" onChange="{{enqSet.phone}}" placeholder="10-digit mobile" style="min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid {{enqErr.phoneBorder}}; background: #0A0612; color: #FFFFFF; font-size: 16px; font-family: inherit; width: 100%; box-sizing: border-box;"><sc-if value="{{enqErr.phone}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #FF8A9B;">{{enqErr.phoneMsg}}</span></sc-if></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8;">Email<input type="email" value="{{enq.email}}" onChange="{{enqSet.email}}" placeholder="Optional" style="min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #0A0612; color: #FFFFFF; font-size: 16px; font-family: inherit; width: 100%; box-sizing: border-box;"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8;">City<input type="text" value="{{enq.city}}" onChange="{{enqSet.city}}" placeholder="e.g. Chennai" style="min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #0A0612; color: #FFFFFF; font-size: 16px; font-family: inherit; width: 100%; box-sizing: border-box;"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8; grid-column: 1 / -1;">I am enquiring for
<span style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{enqTypes}}" as="t" hint-placeholder-count="4"><button type="button" onClick="{{t.pick}}" aria-pressed="{{t.active}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid {{t.border}}; background: {{t.bg}}; color: #FFFFFF; font-size: 15px; font-weight: 500; cursor: pointer;">{{t.label}}</button></sc-for>
</span></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8; grid-column: 1 / -1;">Products / box interested in<input type="text" value="{{enq.product}}" onChange="{{enqSet.product}}" placeholder="e.g. Family Box ₹1000, sparklers" style="min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #0A0612; color: #FFFFFF; font-size: 16px; font-family: inherit; width: 100%; box-sizing: border-box;"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8; grid-column: 1 / -1;">Message<textarea rows="3" value="{{enq.message}}" onChange="{{enqSet.message}}" placeholder="Quantity, delivery date, anything else…" style="padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #0A0612; color: #FFFFFF; font-size: 16px; font-family: inherit; resize: vertical;"></textarea></label>
<button type="submit" style="grid-column: 1 / -1; min-height: 58px; border: 0; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; cursor: pointer;">Send Enquiry</button>
<p style="grid-column: 1 / -1; margin: 0; font-size: 14px; color: #B9B3C9; text-align: center;">Prefer to talk? Call [+91 00000 00000] or WhatsApp us.</p>
</form>
</sc-if>
<sc-if value="{{enqSent}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 0; text-align: center;">
<span style="width: 84px; height: 84px; border-radius: 50%; background: rgba(37,211,102,0.15); display: flex; align-items: center; justify-content: center;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#25D366" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
<h2 id="fw-enq-title" style="margin: 0; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 32px;">Thank you, {{enq.name}}!</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.5; color: #C9C3D8;">We've received your enquiry and will call you on {{enq.phone}} shortly.<br>(Demo — nothing was actually sent.)</p>
<button onClick="{{enqClose}}" style="margin-top: 8px; min-height: 52px; padding: 0 32px; border: 0; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer;">Done</button>
</div>
</sc-if>
</div>
</div>
</sc-if>
</div>
</template>
<script type="text/x-fw-logic" id="fw-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { form: false, qty: 1, cart: {}, toast: '' };
  }
  componentDidMount() { this.cartListen(); }
  componentWillUnmount() { this.cartUnlisten(); }
  cartRead() {
    try { const raw = window.localStorage.getItem('fw-cart'); if (raw) return JSON.parse(raw) || {}; } catch (e) {}
    return window.__fwCart || {};
  }
  cartWrite(cart) {
    window.__fwCart = cart;
    try { window.localStorage.setItem('fw-cart', JSON.stringify(cart)); } catch (e) {}
    this.setState({ cart: cart });
  }
  cartAdd(p, qty) {
    const cart = Object.assign({}, this.cartRead());
    const cur = cart[p.name];
    cart[p.name] = { name: p.name, img: p.img, price: p.price, qty: (cur ? cur.qty : 0) + (qty || 1) };
    this.cartWrite(cart);
    this.showToast(p.name.split(' - ')[0] + ' added to cart');
  }
  cartSet(name, qty) {
    const cart = Object.assign({}, this.cartRead());
    if (!cart[name]) return;
    if (qty <= 0) { delete cart[name]; } else { cart[name] = Object.assign({}, cart[name], { qty: qty }); }
    this.cartWrite(cart);
  }
  cartCount() {
    const c = this.state.cart || {};
    return Object.keys(c).reduce((n, k) => n + c[k].qty, 0);
  }
  showToast(text) {
    clearTimeout(this.toastT);
    this.setState({ toast: text });
    this.toastT = setTimeout(() => this.setState({ toast: '' }), 2600);
  }
  cartListen() {
    this.setState({ cart: this.cartRead() });
    this.onStorage = (e) => { if (!e || e.key === 'fw-cart') this.setState({ cart: this.cartRead() }); };
    this.onVis = () => this.setState({ cart: this.cartRead() });
    window.addEventListener('storage', this.onStorage);
    window.addEventListener('focus', this.onVis);
    document.addEventListener('visibilitychange', this.onVis);
  }
  cartUnlisten() {
    window.removeEventListener('storage', this.onStorage);
    window.removeEventListener('focus', this.onVis);
    document.removeEventListener('visibilitychange', this.onVis);
    clearTimeout(this.toastT);
  }
  openEnquiry(product, type) {
    this.setState({
      enqOpen: true, enqSent: false, enqTried: false,
      enq: Object.assign({ name: '', phone: '', email: '', city: '', product: '', message: '', type: 'Retail purchase' }, this.state.enq || {}, { product: product || (this.state.enq && this.state.enq.product) || '', type: type || (this.state.enq && this.state.enq.type) || 'Retail purchase' })
    });
  }
  enqVals() {
    const enq = this.state.enq || { name: '', phone: '', email: '', city: '', product: '', message: '', type: 'Retail purchase' };
    const tried = this.state.enqTried;
    const nameBad = tried && enq.name.trim().length < 2;
    const phoneBad = tried && enq.phone.replace(/\D/g, '').length < 10;
    const set = {};
    ['name', 'phone', 'email', 'city', 'product', 'message'].forEach((k) => {
      set[k] = (e) => this.setState({ enq: Object.assign({}, this.state.enq || enq, { [k]: e.target.value }) });
    });
    const types = ['Retail purchase', 'Bulk / dealer', 'Corporate gifting', 'Wedding / event'];
    return {
      enqOpen: !!this.state.enqOpen,
      enqSent: !!this.state.enqSent,
      enqNotSent: !this.state.enqSent,
      enq: enq,
      enqSet: set,
      enqErr: {
        name: nameBad, nameMsg: 'Please enter your name', nameBorder: nameBad ? '#FF8A9B' : 'rgba(255,255,255,0.2)',
        phone: phoneBad, phoneMsg: 'Please enter a 10-digit phone number', phoneBorder: phoneBad ? '#FF8A9B' : 'rgba(255,255,255,0.2)'
      },
      enqTypes: types.map((t) => ({
        label: t, active: enq.type === t,
        bg: enq.type === t ? (this.props.accent ?? '#E3112F') : 'transparent',
        border: enq.type === t ? (this.props.accent ?? '#E3112F') : 'rgba(255,255,255,0.25)',
        pick: () => this.setState({ enq: Object.assign({}, enq, { type: t }) })
      })),
      enqClose: () => this.setState({ enqOpen: false, enqTried: false, enqSent: false, enq: this.state.enqSent ? null : this.state.enq }),
      enqSubmit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const ok = enq.name.trim().length >= 2 && enq.phone.replace(/\D/g, '').length >= 10;
        this.setState(ok ? { enqSent: true, enqTried: false } : { enqTried: true });
      },
      openEnq: (e) => { if (e && e.preventDefault) e.preventDefault(); this.openEnquiry(); }
    };
  }
  renderVals() {
    const product = { name: 'Colour Fountain - [Pack size]', img: 'assets/images/colour-fountain.png', price: 350 };
    const cart = this.state.cart || {};
    const inCartQty = cart[product.name] ? cart[product.name].qty : 0;
    return {
      ...this.enqVals(),
      menuOpen: !!this.state.menu,
      toggleMenu: () => this.setState({ menu: !this.state.menu }),
      cartCount: this.cartCount(),
      hasCart: this.cartCount() > 0,
      toastOn: !!this.state.toast,
      toastText: this.state.toast || '',
      qty: this.state.qty,
      qtyInc: () => this.setState({ qty: this.state.qty + 1 }),
      qtyDec: () => this.setState({ qty: Math.max(1, this.state.qty - 1) }),
      enqProduct: () => this.openEnquiry('Colour Fountain - [Pack size]'),
      addToCart: () => { this.cartAdd(product, this.state.qty); this.setState({ qty: 1 }); },
      inCart: inCartQty > 0,
      inCartText: inCartQty + ' in your cart',
      brand: this.props.brand ?? 'Your Brand',
      accent: this.props.accent ?? '#E3112F',
      formOpen: this.state.form,
      openForm: () => this.setState({ form: !this.state.form }),
      related: [
        { name: 'Flower Pot Candles - [Pack size]', img: 'assets/images/flower-pot-candles.png' },
        { name: 'Gold Sparklers - [Pack size]', img: 'assets/images/gold-sparklers.png' },
        { name: 'Sky Rockets - [Pack size]', img: 'assets/images/sky-rockets.png' },
        { name: 'Red Bomb - [Pack size]', img: 'assets/images/red-bomb.png' }
      ]
    };
  }
}
</script>
<script src="js/react.production.min.js"></script>
<script src="js/react-dom.production.min.js"></script>
<script src="js/fw-runtime.js"></script>
</body>
</html>
