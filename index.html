<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Roboto:wght@300;400;500&amp;family=Lilita+One&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0612}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#FFB3BF}
.fw-nav{display:flex}
.fw-burger{display:none}
.fw-g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.fw-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.fw-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:64px;align-items:center}
.fw-foot{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px}
@keyframes fwMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.fw-marquee{animation:fwMarquee 30s linear infinite}
.fw-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.fw-g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px}
.fw-video{display:grid;grid-template-columns:2fr 1fr;gap:24px}
.fw-occ img{transition:transform .6s ease}.fw-occ:hover img{transform:scale(1.08)}
.fw-combo{transition:transform .35s ease,box-shadow .35s ease}.fw-combo:hover{transform:translateY(-8px);box-shadow:0 24px 60px rgba(0,0,0,0.45)}
@keyframes fwPulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,0.55)}70%{box-shadow:0 0 0 18px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.fw-wa{animation:fwPulse 2.4s ease-out infinite}.fw-wa:hover{color:#0B2E17;transform:scale(1.05)}
@media (max-width:1100px){.fw-g5{grid-template-columns:repeat(3,minmax(0,1fr))}.fw-g3{grid-template-columns:repeat(2,minmax(0,1fr))}.fw-video{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.fw-g5{grid-template-columns:repeat(2,minmax(0,1fr))}.fw-g3{grid-template-columns:minmax(0,1fr)}.fw-wa-label{display:none}}
@keyframes fwSlide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes fwRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fwGlow{0%,100%{box-shadow:0 0 0 rgba(227,17,47,0)}50%{box-shadow:0 0 34px rgba(227,17,47,0.45)}}
.fw-viewport{scrollbar-width:none;cursor:grab;user-select:none;-webkit-user-select:none;overscroll-behavior-x:contain;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.fw-ccard{transition:transform .35s ease,box-shadow .35s ease}
.fw-ccard img{transition:transform .6s ease}
.fw-ccard:hover{transform:translateY(-10px);box-shadow:0 20px 50px rgba(227,17,47,0.35)}
.fw-ccard:hover img{transform:scale(1.1)}
.fw-cname{opacity:0;transition:opacity .35s ease}
.fw-cname > span{transform:translateY(16px);transition:transform .35s ease}
.fw-ccard:hover .fw-cname,.fw-ccard:focus-visible .fw-cname{opacity:1}
.fw-ccard:hover .fw-cname > span,.fw-ccard:focus-visible .fw-cname > span{transform:translateY(0)}
.fw-pcard{animation:fwRise 0.7s ease both;transition:transform .35s ease,border-color .35s ease,box-shadow .35s ease}
.fw-pcard:hover{transform:translateY(-10px) scale(1.02);border-color:rgba(255,90,110,0.6);animation:fwGlow 1.8s ease-in-out infinite}
.fw-pimg img{transition:transform .6s ease}
.fw-pcard:hover .fw-pimg img{transform:scale(1.1) rotate(-1deg)}
.fw-ptag{opacity:0;transform:translate(-50%,12px);transition:opacity .3s ease,transform .3s ease}
.fw-pcard:hover .fw-ptag{opacity:1;transform:translate(-50%,0)}
.fw-viewport::-webkit-scrollbar{display:none}
.fw-viewport.fw-dragging{cursor:grabbing}
.fw-viewport.fw-dragging a{pointer-events:none}
@media (prefers-reduced-motion:reduce){.fw-marquee,.fw-pcard{animation:none}}
.fw-hero{background:linear-gradient(180deg,rgba(8,4,20,0.75) 0%,rgba(8,4,20,0.45) 45%,rgba(8,4,24,0.92) 100%),url(assets/images/multi-colour-bursts.png) center/cover no-repeat}
.fw-cta{background:linear-gradient(180deg,rgba(8,4,20,0.92),rgba(8,4,20,0.7),rgba(8,4,20,0.92)),url(assets/images/fireworks-over-city.png) center/cover no-repeat}
@media (max-width:1000px){.fw-g4{grid-template-columns:repeat(2,minmax(0,1fr))}.fw-split{grid-template-columns:minmax(0,1fr);gap:40px}.fw-foot{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.fw-nav{display:none}.fw-burger{display:flex}}
@media (max-width:640px){.fw-g4,.fw-g2,.fw-foot{grid-template-columns:minmax(0,1fr)}}
@keyframes fwToast{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.fw-toast{transform:translateX(-50%);animation:fwToast .3s ease both}
@keyframes fwPop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.fw-badge{animation:fwPop .35s ease}
.fw-step{display:flex;align-items:center;border-radius:999px;border:1.5px solid rgba(255,255,255,0.25);overflow:hidden}
.fw-step button{width:44px;height:44px;border:0;background:transparent;color:#FFFFFF;font-size:22px;cursor:pointer}
.fw-step button:hover{background:rgba(255,255,255,0.1)}
.fw-step span{min-width:36px;text-align:center;font-weight:700;font-size:18px}
@keyframes fwFade{from{opacity:0}to{opacity:1}}
@keyframes fwUp{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.fw-modal{animation:fwFade .25s ease both}
.fw-dialog{animation:fwUp .35s cubic-bezier(.2,.8,.2,1) both}
.fw-dialog input:focus,.fw-dialog textarea:focus{outline:2px solid #FFD166;outline-offset:1px}
@media (max-width:560px){.fw-enqform{grid-template-columns:minmax(0,1fr) !important}}
.fwh-nav{display:flex}
.fwh-burger{display:none}
.fwh-dd{position:relative}
.fwh-mega{position:absolute;top:100%;left:50%;padding-top:18px;transform:translateX(-50%) translateY(8px);opacity:0;visibility:hidden;transition:opacity .2s ease,transform .2s ease,visibility .2s;z-index:80}
.fwh-dd:hover .fwh-mega,.fwh-dd:focus-within .fwh-mega{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.fwh-dd:hover .fwh-chev,.fwh-dd:focus-within .fwh-chev{transform:rotate(180deg)}
.fwh-chev{transition:transform .2s ease}
.fwh-tile img{transition:transform .4s ease}.fwh-tile:hover img{transform:scale(1.08)}
.fwh-link{position:relative;padding:6px 0}
.fwh-link::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:#FF5A6E;transform:scaleX(0);transition:transform .25s ease}
.fwh-link:hover::after,.fwh-link[aria-current="page"]::after{transform:scaleX(1)}
@media (max-width:1280px){.fwh-enq{display:none !important}}
@media (max-width:1100px){.fwh-nav{display:none}.fwh-burger{display:flex}}
.fw-journey .fw-jspark{left:100%}
.fw-journey.fw-armed .fw-jfill{transform:scaleX(0);transform-origin:left center;transition:transform 2.4s cubic-bezier(.4,0,.2,1)}
.fw-journey.fw-armed .fw-jspark{left:0;opacity:0;transition:left 2.4s cubic-bezier(.4,0,.2,1),opacity .3s ease}
.fw-journey.fw-armed.fw-lit .fw-jfill{transform:scaleX(1)}
.fw-journey.fw-armed.fw-lit .fw-jspark{left:100%;opacity:1;animation:fwSparkGlow .5s ease-in-out infinite alternate}
.fw-journey.fw-armed .fw-jitem{opacity:0;transform:translateY(28px) scale(.96);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.fw-journey.fw-armed.fw-lit .fw-jitem{opacity:1;transform:none}
.fw-journey.fw-lit .fw-jdot{animation:fwDotPop .6s ease both;animation-delay:inherit}
@keyframes fwSparkGlow{from{transform:scale(.8);box-shadow:0 0 12px 4px rgba(255,209,102,.6)}to{transform:scale(1.25);box-shadow:0 0 26px 10px rgba(255,138,61,.7)}}
@keyframes fwDotPop{0%{box-shadow:0 0 0 8px rgba(13,6,24,1),0 0 0 8px rgba(255,209,102,.0)}50%{box-shadow:0 0 0 8px rgba(13,6,24,1),0 0 30px 14px rgba(255,209,102,.45)}100%{box-shadow:0 0 0 8px rgba(13,6,24,1),0 0 0 0 rgba(255,209,102,0)}}
.fw-jitem{transition:transform .3s ease}.fw-journey.fw-lit .fw-jitem:hover{transform:translateY(-6px)}
@media (max-width:900px){.fw-jline{display:none}.fw-jgrid{grid-template-columns:minmax(0,1fr) !important;gap:0 !important;border-left:3px solid rgba(255,209,102,.4);margin-left:34px !important;padding-left:0 !important}.fw-jitem{flex-direction:row !important;flex-wrap:wrap;align-items:center;padding:0 0 32px 0;margin-left:-38px}.fw-jitem > span:nth-child(n+3){flex-basis:100%;padding-left:88px}}
@media (prefers-reduced-motion:reduce){.fw-journey.fw-armed .fw-jfill,.fw-journey.fw-armed .fw-jitem,.fw-journey.fw-armed .fw-jspark{transition:none}}
</style>
</head>

<script type="text/x-fw-logic" id="fw-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cart: {}, toast: '', cat: 0, prod: 0, faq: -1, menu: false, w: (typeof window !== 'undefined' ? window.innerWidth : 1440) };
  }
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    const v = document.querySelector('.fw-hero-video');
    if (v) { v.muted = true; const p = v.play && v.play(); if (p && p.catch) p.catch(() => {}); }
    this.startSliders();
    this.cartListen();
    const j = document.querySelector('.fw-journey');
    if (j) {
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduce && 'IntersectionObserver' in window) {
        j.classList.add('fw-armed');
        this.jObs = new IntersectionObserver((entries) => {
          entries.forEach((en) => { if (en.isIntersecting) { j.classList.add('fw-lit'); this.jObs.disconnect(); } });
        }, { threshold: 0.35 });
        this.jObs.observe(j);
      } else { j.classList.add('fw-lit'); }
    }
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    if (this.raf) cancelAnimationFrame(this.raf);
    (this.cleanups || []).forEach((fn) => fn());
    this.cartUnlisten();
    if (this.jObs) this.jObs.disconnect();
  }
  cartRead() {
    try { const raw = window.localStorage.getItem('fw-cart'); if (raw) return JSON.parse(raw) || {}; } catch (e) {}
    return window.__fwCart || {};
  }
  cartWrite(cart) {
    window.__fwCart = cart;
    try { window.localStorage.setItem('fw-cart', JSON.stringify(cart)); } catch (e) {}
    this.setState({ cart: cart });
  }
  cartAdd(p, qty) {
    const cart = Object.assign({}, this.cartRead());
    const cur = cart[p.name];
    cart[p.name] = { name: p.name, img: p.img, price: p.price, qty: (cur ? cur.qty : 0) + (qty || 1) };
    this.cartWrite(cart);
    this.showToast(p.name.split(' - ')[0] + ' added to cart');
  }
  cartSet(name, qty) {
    const cart = Object.assign({}, this.cartRead());
    if (!cart[name]) return;
    if (qty <= 0) { delete cart[name]; } else { cart[name] = Object.assign({}, cart[name], { qty: qty }); }
    this.cartWrite(cart);
  }
  cartCount() {
    const c = this.state.cart || {};
    return Object.keys(c).reduce((n, k) => n + c[k].qty, 0);
  }
  showToast(text) {
    clearTimeout(this.toastT);
    this.setState({ toast: text });
    this.toastT = setTimeout(() => this.setState({ toast: '' }), 2600);
  }
  cartListen() {
    this.setState({ cart: this.cartRead() });
    this.onStorage = (e) => { if (!e || e.key === 'fw-cart') this.setState({ cart: this.cartRead() }); };
    this.onVis = () => this.setState({ cart: this.cartRead() });
    window.addEventListener('storage', this.onStorage);
    window.addEventListener('focus', this.onVis);
    document.addEventListener('visibilitychange', this.onVis);
  }
  cartUnlisten() {
    window.removeEventListener('storage', this.onStorage);
    window.removeEventListener('focus', this.onVis);
    document.removeEventListener('visibilitychange', this.onVis);
    clearTimeout(this.toastT);
  }
  startSliders() {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SPEED = 0.6;
    const PAUSE_AFTER_USER = 2000;
    this.cleanups = [];
    this.sliders = Array.prototype.slice.call(document.querySelectorAll('.fw-viewport')).map((el) => {
      const s = { el: el, dir: el.getAttribute('data-dir') === 'rev' ? -1 : 1, pos: 0, hover: false, last: 0, drag: null, init: false };
      const touch = () => { s.last = Date.now(); };
      const enter = () => { s.hover = true; };
      const leave = () => { s.hover = false; s.last = Date.now(); };
      const down = (e) => {
        if (e.pointerType !== 'mouse' || e.button !== 0) { touch(); return; }
        s.drag = { x: e.clientX, start: el.scrollLeft, moved: false };
      };
      const move = (e) => {
        if (!s.drag) return;
        const dx = e.clientX - s.drag.x;
        if (Math.abs(dx) > 5) { s.drag.moved = true; el.classList.add('fw-dragging'); }
        el.scrollLeft = s.drag.start - dx;
        s.pos = el.scrollLeft;
      };
      const up = () => {
        if (!s.drag) return;
        s.drag = null; s.last = Date.now();
        setTimeout(() => el.classList.remove('fw-dragging'), 0);
      };
      el.addEventListener('mouseenter', enter);
      el.addEventListener('mouseleave', leave);
      el.addEventListener('wheel', touch, { passive: true });
      el.addEventListener('touchstart', touch, { passive: true });
      el.addEventListener('touchmove', touch, { passive: true });
      el.addEventListener('pointerdown', down);
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      this.cleanups.push(() => {
        el.removeEventListener('mouseenter', enter); el.removeEventListener('mouseleave', leave);
        el.removeEventListener('wheel', touch); el.removeEventListener('touchstart', touch);
        el.removeEventListener('touchmove', touch); el.removeEventListener('pointerdown', down);
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      });
      return s;
    });
    const tick = () => {
      const now = Date.now();
      this.sliders.forEach((s) => {
        const el = s.el;
        const half = el.scrollWidth / 2;
        if (!half || el.clientWidth === 0) return;
        if (!s.init) { s.pos = s.dir < 0 ? half : 0; el.scrollLeft = s.pos; s.init = true; }
        const userBusy = s.hover || s.drag || (now - s.last < PAUSE_AFTER_USER);
        if (!userBusy && !reduce) { s.pos += s.dir * SPEED; } else { s.pos = el.scrollLeft; }
        if (s.pos >= half) s.pos -= half;
        if (s.pos <= 0) s.pos += half;
        if (Math.abs(el.scrollLeft - s.pos) >= 0.5) el.scrollLeft = s.pos;
      });
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  openEnquiry(product, type) {
    this.setState({
      enqOpen: true, enqSent: false, enqTried: false,
      enq: Object.assign({ name: '', phone: '', email: '', city: '', product: '', message: '', type: 'Retail purchase' }, this.state.enq || {}, { product: product || (this.state.enq && this.state.enq.product) || '', type: type || (this.state.enq && this.state.enq.type) || 'Retail purchase' })
    });
  }
  enqVals() {
    const enq = this.state.enq || { name: '', phone: '', email: '', city: '', product: '', message: '', type: 'Retail purchase' };
    const tried = this.state.enqTried;
    const nameBad = tried && enq.name.trim().length < 2;
    const phoneBad = tried && enq.phone.replace(/\D/g, '').length < 10;
    const set = {};
    ['name', 'phone', 'email', 'city', 'product', 'message'].forEach((k) => {
      set[k] = (e) => this.setState({ enq: Object.assign({}, this.state.enq || enq, { [k]: e.target.value }) });
    });
    const types = ['Retail purchase', 'Bulk / dealer', 'Corporate gifting', 'Wedding / event'];
    return {
      enqOpen: !!this.state.enqOpen,
      enqSent: !!this.state.enqSent,
      enqNotSent: !this.state.enqSent,
      enq: enq,
      enqSet: set,
      enqErr: {
        name: nameBad, nameMsg: 'Please enter your name', nameBorder: nameBad ? '#FF8A9B' : 'rgba(255,255,255,0.2)',
        phone: phoneBad, phoneMsg: 'Please enter a 10-digit phone number', phoneBorder: phoneBad ? '#FF8A9B' : 'rgba(255,255,255,0.2)'
      },
      enqTypes: types.map((t) => ({
        label: t, active: enq.type === t,
        bg: enq.type === t ? (this.props.accent ?? '#E3112F') : 'transparent',
        border: enq.type === t ? (this.props.accent ?? '#E3112F') : 'rgba(255,255,255,0.25)',
        pick: () => this.setState({ enq: Object.assign({}, enq, { type: t }) })
      })),
      enqClose: () => this.setState({ enqOpen: false, enqTried: false, enqSent: false, enq: this.state.enqSent ? null : this.state.enq }),
      enqSubmit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const ok = enq.name.trim().length >= 2 && enq.phone.replace(/\D/g, '').length >= 10;
        this.setState(ok ? { enqSent: true, enqTried: false } : { enqTried: true });
      },
      openEnq: (e) => { if (e && e.preventDefault) e.preventDefault(); this.openEnquiry(); }
    };
  }
  renderVals() {
    const w = this.state.w || 1440;
    const per = w < 640 ? 2 : (w < 1100 ? 4 : 6);
    const gap = 24;
    const cardW = 'calc((100% - ' + ((per - 1) * gap) + 'px) / ' + per + ')';
    const shift = (i) => 'calc(' + (-i) + ' * ((100% - ' + ((per - 1) * gap) + 'px) / ' + per + ' + ' + gap + 'px))';

    const categories = [
      { name: 'CHILDREN\nFANCY\nFIREWORKS', bg: '#EFCDEB', bg2: '#A68BC4', ink: '#8A5BB5', img: 'assets/images/kids-fancy-icons.png' },
      { name: 'UNIQUE\nAERIAL\nFIREWORKS', bg: '#D3F4EF', bg2: '#73D6CB', ink: '#1E9C8F', img: 'assets/images/sky-rockets.png' },
      { name: 'TRADITIONAL\nFIREWORKS', bg: '#F8D8EA', bg2: '#F27FB5', ink: '#D0245E', img: 'assets/images/garland-crackers.png' },
      { name: 'FOUNTAINS', bg: '#FDE6B4', bg2: '#F7AE5E', ink: '#C26408', img: 'assets/images/golden-fountain.png' },
      { name: 'SPARKLERS', bg: '#DFF3A8', bg2: '#97CE5A', ink: '#3D7F14', img: 'assets/images/sparkler-hand.png' },
      { name: 'ELITE\nFIREWORKS', bg: '#B8E8F8', bg2: '#4796D8', ink: '#1F66A8', img: 'assets/images/golden-sky-burst.png' },
      { name: 'GIFT\nBOXES', bg: '#FFD6CC', bg2: '#F2785C', ink: '#C9432A', img: 'assets/images/festive-crackers.png' },
      { name: 'SKY\nSHOTS', bg: '#E0DBFF', bg2: '#8C7CF0', ink: '#5A49D6', img: 'assets/images/fireworks-over-city.png' }
    ];
    const products = [
      { name: 'Colour Fountain - [Pack size]', img: 'assets/images/colour-fountain.png' },
      { name: 'Flower Pot Candles - [Pack size]', img: 'assets/images/flower-pot-candles.png' },
      { name: 'Red Bomb - [Pack size]', img: 'assets/images/red-bomb.png' },
      { name: 'Gold Sparklers - [Pack size]', img: 'assets/images/gold-sparklers.png' },
      { name: 'Sky Rockets - [Pack size]', img: 'assets/images/sky-rockets.png' },
      { name: 'Festive Crackers - [Pack size]', img: 'assets/images/festive-crackers.png' },
      { name: 'Garland Crackers - [Pack size]', img: 'assets/images/garland-crackers.png' },
      { name: 'Kids Fancy Combo - [Pack size]', img: 'assets/images/kids-fancy-icons.png' }
    ];
    const catMax = Math.max(0, categories.length - per);
    const prodMax = Math.max(0, products.length - per);
    const cat = Math.min(this.state.cat, catMax);
    const prod = Math.min(this.state.prod, prodMax);

    const B = (this.props.brand ?? 'Your Brand') + ' Fireworks';
    const faqList = [
      ['What do you mean by Green Crackers?', 'Green crackers are eco-friendlier fireworks developed under CSIR-NEERI guidelines. They use cleaner raw materials and produce noticeably less smoke, dust and noise than regular crackers. Certified green crackers carry the CSIR-NEERI green logo and a QR code on the box, so you can check them before you buy.'],
      ['Which is the fireworks capital of India?', 'Sivakasi in Tamil Nadu is known as the fireworks capital of India. Most of the country’s crackers are made there, and we source many of our products from trusted Sivakasi manufacturers.'],
      ['What is the speciality of ' + B + '?', 'We offer a complete range under one roof — traditional crackers, kids’ fancy items, fountains, sparklers, aerial sky shots and ready-made combo boxes for every budget. Every product is chosen for colour, safety and value, and our team helps you pick the right mix for your celebration.'],
      ['When was ' + B + ' started?', B + ' was started in 2010 in Jaunpur, Uttar Pradesh. For over 15 years we have been helping families, shops and event planners celebrate Diwali, weddings and other festivals.'],
      ['How can we buy your crackers?', 'You can visit our shop in Jaunpur, add products to your cart on this website and place an order enquiry, send us an enquiry form, or message us on WhatsApp. Our team will call you to confirm stock, price and delivery.'],
      ['Are your products available throughout the year?', 'Yes. We supply crackers all year for weddings, birthdays, New Year and other events. Our full Diwali range is available from September to November — we recommend booking early, as popular items sell out before the festival.'],
      ['How to contact us for enquiries?', 'Call or WhatsApp us on [+91 00000 00000], email [enquiry@yourdomain.com], or click “Enquire Now” on any page and fill in the short form. We usually reply the same day.'],
      ['Do you supply in bulk to retailers?', 'Yes. We supply shops, wholesalers, seasonal stalls, corporate buyers and event planners at dealer rates. Visit our Bulk Orders page to download the wholesale price list or register as a dealer, and our team will contact you.']
    ];
    const faqs = faqList.map((f, i) => ({
      q: f[0], a: f[1], open: this.state.faq === i, rot: this.state.faq === i ? '180deg' : '0deg',
      toggle: () => this.setState({ faq: this.state.faq === i ? -1 : i })
    }));

    return {
      ...this.enqVals(),
      cartCount: this.cartCount(),
      hasCart: this.cartCount() > 0,
      toastOn: !!this.state.toast,
      toastText: this.state.toast || '',
      brand: this.props.brand ?? 'Your Brand',
      accent: this.props.accent ?? '#E3112F',
      menuOpen: this.state.menu,
      toggleMenu: () => this.setState({ menu: !this.state.menu }),
      categories: categories,
      categoryLoop: categories.concat(categories).map((c) => ({ img: c.img, label: c.name.replace(/\n/g, ' ') })),
      products: products,
      productLoop: products.concat(products),
      cardW: cardW,
      catShift: shift(cat),
      prodShift: shift(prod),
      catPrev: () => this.setState({ cat: Math.max(0, cat - 1) }),
      catNext: () => this.setState({ cat: cat >= catMax ? 0 : cat + 1 }),
      prodPrev: () => this.setState({ prod: Math.max(0, prod - 1) }),
      prodNext: () => this.setState({ prod: prod >= prodMax ? 0 : prod + 1 }),
      quick: [
        { title: 'Aerial Fireworks', text: 'Sky bursts with loud colours and patterns.', cta: 'Explore', href: 'category.html' },
        { title: 'Gift Boxes', text: 'Curated boxes — perfect for celebrations and corporate gifting.', cta: 'Explore', href: 'category.html' },
        { title: 'New Arrivals', text: 'Latest launches and unique crackers for this season.', cta: 'Explore', href: 'newarrivals.html' },
        { title: 'Safety Tips', text: 'How to enjoy safely — essential guidance for families and retailers.', cta: 'Read', href: '#safety-checklist' }
      ],
      stats: [
        { num: '15+', label: 'Years of experience', text: 'Serving festivals and celebrations since 2010 from Jaunpur, Uttar Pradesh.' },
        { num: '8', label: 'Product categories', text: 'Traditional, kids’ fancy, aerial, fountains, sparklers, elite, gift boxes and sky shots.' },
        { num: '5', label: 'Occasions covered', text: 'Diwali, weddings, birthdays, corporate gifting and New Year — a pack for every celebration.' }
      ],
      reviews: [
        { title: 'Kids loved the fountains', text: 'Ordered the Family Box for Diwali. Everything arrived well packed and on time — the fountains and sparklers were the highlight for the children.', initial: 'P', name: 'Sample customer', role: 'Parent · Jaunpur', tint: '#BFF3E3', date: 'Diwali 2025' },
