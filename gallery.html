<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | Your Brand Fireworks</title>
<meta name="description" content="Your Brand Fireworks, Jaunpur — crackers, sparklers, fountains, sky shots and combo boxes for Diwali, weddings and every celebration since 2010.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Roboto:wght@300;400;500&amp;family=Lilita+One&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0612}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#FFB3BF}
.fw-nav{display:flex}
.fw-g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
@media (max-width:1000px){.fw-g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.fw-nav{display:none}}
@media (max-width:640px){.fw-g4{grid-template-columns:minmax(0,1fr)}}
@keyframes fwToast{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.fw-toast{transform:translateX(-50%);animation:fwToast .3s ease both}
@keyframes fwPop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.fw-badge{animation:fwPop .35s ease}
.fw-step{display:flex;align-items:center;border-radius:999px;border:1.5px solid rgba(255,255,255,0.25);overflow:hidden}
.fw-step button{width:44px;height:44px;border:0;background:transparent;color:#FFFFFF;font-size:22px;cursor:pointer}
.fw-step button:hover{background:rgba(255,255,255,0.1)}
.fw-step span{min-width:36px;text-align:center;font-weight:700;font-size:18px}
@keyframes fwFade{from{opacity:0}to{opacity:1}}
@keyframes fwUp{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.fw-modal{animation:fwFade .25s ease both}
.fw-dialog{animation:fwUp .35s cubic-bezier(.2,.8,.2,1) both}
.fw-dialog input:focus,.fw-dialog textarea:focus{outline:2px solid #FFD166;outline-offset:1px}
@media (max-width:560px){.fw-enqform{grid-template-columns:minmax(0,1fr) !important}}
.fw-chips{scrollbar-width:none}.fw-chips::-webkit-scrollbar{display:none}
@supports (backdrop-filter: blur(8px)){.fw-filterbar{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}}
@keyframes fwZoom{from{transform:scale(1.12)}to{transform:scale(1)}}
.fw-banner-img{animation:fwZoom 1.6s ease-out both}
.fw-banner-text{animation:fwRise .7s ease .1s both}
@keyframes fwRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.fwh-nav{display:flex}
.fwh-burger{display:none}
.fwh-dd{position:relative}
.fwh-mega{position:absolute;top:100%;left:50%;padding-top:18px;transform:translateX(-50%) translateY(8px);opacity:0;visibility:hidden;transition:opacity .2s ease,transform .2s ease,visibility .2s;z-index:80}
.fwh-dd:hover .fwh-mega,.fwh-dd:focus-within .fwh-mega{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.fwh-dd:hover .fwh-chev,.fwh-dd:focus-within .fwh-chev{transform:rotate(180deg)}
.fwh-chev{transition:transform .2s ease}
.fwh-tile img{transition:transform .4s ease}.fwh-tile:hover img{transform:scale(1.08)}
.fwh-link{position:relative;padding:6px 0}
.fwh-link::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:#FF5A6E;transform:scaleX(0);transition:transform .25s ease}
.fwh-link:hover::after,.fwh-link[aria-current="page"]::after{transform:scaleX(1)}
@media (max-width:1280px){.fwh-enq{display:none !important}}
@media (max-width:1100px){.fwh-nav{display:none}.fwh-burger{display:flex}}
.fw-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.fw-g2b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fw-cartgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);gap:32px}
.fw-combo{transition:transform .35s ease,box-shadow .35s ease}.fw-combo:hover{transform:translateY(-8px);box-shadow:0 24px 60px rgba(0,0,0,0.45)}
@media (max-width:1100px){.fw-g3{grid-template-columns:repeat(2,minmax(0,1fr))}.fw-cartgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.fw-g3,.fw-g2b{grid-template-columns:minmax(0,1fr)}}
.fw-g4o{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
@media (max-width:1100px){.fw-g4o{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.fw-g4o{grid-template-columns:minmax(0,1fr)}}
.fw-masonry{column-count:3;column-gap:20px}
.fw-gitem img{transition:transform .5s ease}.fw-gitem:hover img{transform:scale(1.05)}
.fw-gcap{opacity:0;transition:opacity .3s ease}.fw-gitem:hover .fw-gcap,.fw-gitem:focus-visible .fw-gcap{opacity:1}
@media (max-width:1000px){.fw-masonry{column-count:2}}
@media (max-width:560px){.fw-masonry{column-count:1}}
</style>
</head>
<body>
<div id="fw-root"></div>
<template id="fw-template">
<div style="font-family: 'Roboto', system-ui, sans-serif; color: #F5F3FA; background: linear-gradient(160deg, #0E0410 0%, #07061A 55%, #0B0A3A 100%); min-height: 100vh;">
<header style="position: relative; z-index: 40; width: 100%; box-sizing: border-box; margin: 0; padding: 22px clamp(16px, 4vw, 72px); display: flex; align-items: center; justify-content: space-between; gap: 24px;">
<a href="index.html" style="display: flex; align-items: center; gap: 12px; flex: none;" aria-label="Home">
<svg width="52" height="52" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 61,37 96,37 68,58 78,92 50,71 22,92 32,58 4,37 39,37" fill="{{accent}}" stroke="#FFD166" stroke-width="4" stroke-linejoin="round"></polygon><circle cx="50" cy="52" r="10" fill="#FFFFFF"></circle></svg>
<span style="display: flex; flex-direction: column; line-height: 1;"><span style="font-family: 'Lilita One', 'Nunito', sans-serif; font-size: 30px; color: #FFFFFF; letter-spacing: 0.5px;">{{brand}}</span><span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 4px; color: #FFD166; margin-top: 4px;">FIREWORKS</span></span>
</a>
<nav class="fwh-nav" aria-label="Main" style="align-items: center; gap: 28px; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700;">
<a href="index.html" class="fwh-link">Home</a>
<div class="fwh-dd">
<a href="category.html" class="fwh-link" aria-haspopup="true" style="display: flex; align-items: center; gap: 6px;">Products<svg class="fwh-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<div class="fwh-mega">
<div style="width: 760px; padding: 24px; border-radius: 22px; background: #160C2C; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 30px 70px rgba(0,0,0,0.6); font-family: 'Roboto', sans-serif;">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;"><span style="font-size: 13px; letter-spacing: 3px; color: #FFD166;">SHOP BY CATEGORY</span><a href="category.html" style="font-size: 15px; font-weight: 600; color: #FFB3BF;">View all products →</a></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px;"><a href="category.html" class="fwh-tile" style="display: flex; flex-direction: column; gap: 8px; color: #FFFFFF;"><span style="display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #FFFFFF;"><img src="assets/images/multi-colour-bursts.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="font-size: 15px; font-weight: 600;">All Products</span></a><a href="newarrivals.html" class="fwh-tile" style="display: flex; flex-direction: column; gap: 8px; color: #FFFFFF;"><span style="display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #FFFFFF;"><img src="assets/images/gold-sparklers.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="font-size: 15px; font-weight: 600;">New Arrivals</span></a><a href="category.html" class="fwh-tile" style="display: flex; flex-direction: column; gap: 8px; color: #FFFFFF;"><span style="display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #FFFFFF;"><img src="assets/images/kids-fancy-icons.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="font-size: 15px; font-weight: 600;">Kids Fancy</span></a><a href="category.html" class="fwh-tile" style="display: flex; flex-direction: column; gap: 8px; color: #FFFFFF;"><span style="display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #FFFFFF;"><img src="assets/images/fireworks-over-city.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="font-size: 15px; font-weight: 600;">Aerial & Rockets</span></a><a href="category.html" class="fwh-tile" style="display: flex; flex-direction: column; gap: 8px; color: #FFFFFF;"><span style="display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #FFFFFF;"><img src="assets/images/garland-crackers.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="font-size: 15px; font-weight: 600;">Traditional</span></a><a href="fountains.html" class="fwh-tile" style="display: flex; flex-direction: column; gap: 8px; color: #FFFFFF;"><span style="display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #FFFFFF;"><img src="assets/images/golden-fountain.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="font-size: 15px; font-weight: 600;">Fountains</span></a><a href="category.html" class="fwh-tile" style="display: flex; flex-direction: column; gap: 8px; color: #FFFFFF;"><span style="display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #FFFFFF;"><img src="assets/images/sparkler-hand.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="font-size: 15px; font-weight: 600;">Sparklers</span></a><a href="eliteseries.html" class="fwh-tile" style="display: flex; flex-direction: column; gap: 8px; color: #FFFFFF;"><span style="display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #FFFFFF;"><img src="assets/images/golden-sky-burst.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></span><span style="font-size: 15px; font-weight: 600;">Elite Series</span></a></div>
</div>
</div>
</div>
<a href="combos.html" class="fwh-link">Combo Boxes</a><a href="offers.html" class="fwh-link">Offers</a><a href="bulk.html" class="fwh-link">Bulk Orders</a><a href="gallery.html" class="fwh-link" aria-current="page">Gallery</a><a href="contact.html" class="fwh-link">Contact</a>
</nav>
<div style="display: flex; align-items: center; gap: 12px; flex: none;">
<a href="cart.html" aria-label="Cart, {{cartCount}} items" style="position: relative; width: 52px; height: 52px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
<sc-if value="{{hasCart}}" hint-placeholder-val="{{ false }}"><span class="fw-badge" style="position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{cartCount}}</span></sc-if>
</a>
<a href="#enquire" onClick="{{openEnq}}" class="fwh-enq" style="display: flex; align-items: center; min-height: 48px; padding: 0 24px; border: 1.5px solid {{accent}}; border-radius: 999px; font-family: 'Nunito', sans-serif; font-weight: 700; letter-spacing: 1.5px; font-size: 14px; white-space: nowrap;">ENQUIRE NOW</a>
<button class="fwh-burger" onClick="{{toggleMenu}}" aria-label="Open menu" style="width: 48px; height: 48px; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: #FFFFFF; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</div>
</header>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<nav aria-label="Mobile" style="position: relative; z-index: 40; margin: 0 16px 16px; padding: 12px 24px 20px; display: flex; flex-direction: column; background: #160C2A; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700;">
<a href="index.html" style="padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08);">Home</a><a href="category.html" style="padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08);">Products</a><a href="combos.html" style="padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08);">Combo Boxes</a><a href="offers.html" style="padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08);">Offers</a><a href="bulk.html" style="padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08);">Bulk Orders</a><a href="gallery.html" style="padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08);">Gallery</a><a href="contact.html" style="padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08);">Contact</a>
<span style="margin-top: 16px; font-size: 13px; letter-spacing: 3px; color: #FFD166;">CATEGORIES</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-weight: 600;"><a href="category.html" style="padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 15px;">All Products</a><a href="newarrivals.html" style="padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 15px;">New Arrivals</a><a href="category.html" style="padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 15px;">Kids Fancy</a><a href="category.html" style="padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 15px;">Aerial & Rockets</a><a href="category.html" style="padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 15px;">Traditional</a><a href="fountains.html" style="padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 15px;">Fountains</a><a href="category.html" style="padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 15px;">Sparklers</a><a href="eliteseries.html" style="padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 15px;">Elite Series</a></div>
<a href="#enquire" onClick="{{openEnq}}" style="margin-top: 16px; display: flex; justify-content: center; align-items: center; min-height: 50px; border-radius: 999px; background: {{accent}};">Enquire Now</a>
</nav>
</sc-if>

<section class="fw-banner" style="position: relative; overflow: hidden; min-height: 380px; display: flex; align-items: flex-end; padding: 72px clamp(16px, 4vw, 72px) 56px; box-sizing: border-box;">
<img src="assets/images/multi-colour-bursts.png" alt="" class="fw-banner-img" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
<span aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, rgba(10,6,18,0.94) 0%, rgba(10,6,18,0.75) 45%, rgba(10,6,18,0.25) 100%), linear-gradient(0deg, rgba(10,6,18,0.9) 0%, rgba(10,6,18,0) 40%);"></span>
<div class="fw-banner-text" style="position: relative; max-width: 820px; display: flex; flex-direction: column; gap: 16px;">
<nav aria-label="Breadcrumb" style="font-size: 16px; color: #D8D3E6;"><a href="index.html" style="color: #D8D3E6;">Home</a><span style="margin: 0 10px;">/</span><span style="color: #FFB3BF;">Gallery</span></nav>
<h1 style="margin: 0; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: clamp(42px, 5.5vw, 84px); line-height: 1.02;">Gallery</h1>
<p style="margin: 0; font-weight: 300; font-size: clamp(18px, 1.5vw, 22px); line-height: 1.55; color: #E4DFEE;">See our crackers light up — product shots, festival moments and videos.</p>

</div>
</section>

<section style="padding: 48px clamp(16px, 4vw, 72px) 100px;">
<div style="display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 32px;">
<sc-for list="{{gTabs}}" as="t" hint-placeholder-count="5"><button onClick="{{t.pick}}" aria-pressed="{{t.active}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1.5px solid {{t.border}}; background: {{t.bg}}; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer;">{{t.label}}</button></sc-for>
</div>
<div class="fw-masonry">
<sc-for list="{{gItems}}" as="g" hint-placeholder-count="12">
<button onClick="{{g.open}}" class="fw-gitem" aria-label="Open {{g.cap}}" style="display: block; width: 100%; margin: 0 0 20px; padding: 0; border: 0; border-radius: 20px; overflow: hidden; position: relative; cursor: zoom-in; background: #140C24; break-inside: avoid;">
<img src="{{g.thumb}}" alt="" style="width: 100%; display: block;">
<sc-if value="{{g.isVideo}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);"><svg width="26" height="26" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span></sc-if>
<span class="fw-gcap" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 18px 16px; background: linear-gradient(0deg, rgba(10,6,18,0.9), rgba(10,6,18,0)); color: #FFFFFF; font-size: 16px; font-weight: 600; text-align: left;">{{g.cap}}</span>
</button>
</sc-for>
</div>
</section>
<sc-if value="{{lbOpen}}" hint-placeholder-val="{{ false }}">
<div class="fw-modal" role="dialog" aria-modal="true" aria-label="{{lb.cap}}" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 70px 80px; box-sizing: border-box; background: rgba(5,3,12,0.94);">
<button onClick="{{lbClose}}" aria-label="Close" style="position: absolute; top: 18px; right: 18px; width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<button onClick="{{lbPrev}}" aria-label="Previous" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; border-radius: 50%; border: 0; background: #4B3BD6; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button onClick="{{lbNext}}" aria-label="Next" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; border-radius: 50%; border: 0; background: #4B3BD6; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<figure class="fw-dialog" style="margin: 0; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px;">
<sc-if value="{{lb.isVideo}}" hint-placeholder-val="{{ false }}"><video src="{{lb.src}}" controls="" autoplay="" muted="" loop="" playsinline="" style="max-width: 100%; max-height: 72vh; border-radius: 18px; display: block;"></video></sc-if>
<sc-if value="{{lb.isImage}}" hint-placeholder-val="{{ true }}"><img src="{{lb.src}}" alt="{{lb.cap}}" style="max-width: 100%; max-height: 72vh; border-radius: 18px; display: block; object-fit: contain;"></sc-if>
<figcaption style="font-size: 17px; color: #E4DFEE;">{{lb.cap}} · {{lb.pos}}</figcaption>
</figure>
</div>
</sc-if>

<sc-if value="{{toastOn}}" hint-placeholder-val="{{ false }}">
<div role="status" class="fw-toast" style="position: fixed; left: 50%; bottom: 28px; z-index: 60; display: flex; align-items: center; gap: 18px; padding: 14px 16px 14px 22px; border-radius: 999px; background: #FFFFFF; color: #141225; box-shadow: 0 16px 40px rgba(0,0,0,0.45); font-size: 17px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E9C5A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
<span>{{toastText}}</span>
<a href="cart.html" style="padding: 10px 18px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 15px;">View cart</a>
</div>
</sc-if>
<div style="display: flex; height: 5px;" aria-hidden="true"><span style="flex: 1; background: #1E45F5;"></span><span style="flex: 1; background: #4FD3F5;"></span><span style="flex: 1; background: #E05252;"></span><span style="flex: 1; background: #F59CF0;"></span><span style="flex: 1; background: #A8D46A;"></span></div>
<footer style="background: #0A0E2E;">
<div style="width: 100%; box-sizing: border-box; margin: 0; padding: 48px clamp(16px, 4vw, 72px); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; font-size: 17px; color: #C9C3D8;">
<span>[Street address], [City] - [PIN], [State]</span>
<span>[enquiry@yourdomain.com] · [+91 00000 00000]</span>
</div>
<div style="background: #050505; padding: 22px clamp(16px, 4vw, 72px); text-align: center; font-size: 15px; color: #B9B3C9;">Copyright © 2026 {{brand}} Fireworks. All rights reserved.</div>
</footer>
<sc-if value="{{enqOpen}}" hint-placeholder-val="{{ false }}">
<div class="fw-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; background: rgba(5,3,12,0.78);">
<button onClick="{{enqClose}}" aria-label="Close enquiry form" tabindex="-1" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: transparent; cursor: default;"></button>
<div role="dialog" aria-modal="true" aria-labelledby="fw-enq-title" class="fw-dialog" style="position: relative; width: 100%; max-width: 640px; max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 36px clamp(20px, 4vw, 40px); border-radius: 28px; background: linear-gradient(180deg, #1A0C2E, #100A28); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 30px 80px rgba(0,0,0,0.6); color: #F5F3FA; font-family: 'Roboto', system-ui, sans-serif;">
<button onClick="{{enqClose}}" aria-label="Close" style="position: absolute; top: 18px; right: 18px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<sc-if value="{{enqNotSent}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0 0 8px; font-size: 14px; letter-spacing: 4px; color: #FFD166;">GET IN TOUCH</p>
<h2 id="fw-enq-title" style="margin: 0 0 8px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 34px;">Send an Enquiry</h2>
<p style="margin: 0 0 24px; font-size: 17px; line-height: 1.5; color: #C9C3D8;">Tell us what you need and our team will call you back with prices and availability.</p>
<form onSubmit="{{enqSubmit}}" novalidate="" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;" class="fw-enqform">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8;">Full name <span style="color: #FF8A9B;">*</span><input type="text" value="{{enq.name}}" onChange="{{enqSet.name}}" placeholder="Your name" style="min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid {{enqErr.nameBorder}}; background: #0A0612; color: #FFFFFF; font-size: 16px; font-family: inherit; width: 100%; box-sizing: border-box;"><sc-if value="{{enqErr.name}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #FF8A9B;">{{enqErr.nameMsg}}</span></sc-if></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8;">Phone number <span style="color: #FF8A9B;">*</span><input type="tel" value="{{enq.phone}}" onChange="{{enqSet.phone}}" placeholder="10-digit mobile" style="min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid {{enqErr.phoneBorder}}; background: #0A0612; color: #FFFFFF; font-size: 16px; font-family: inherit; width: 100%; box-sizing: border-box;"><sc-if value="{{enqErr.phone}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #FF8A9B;">{{enqErr.phoneMsg}}</span></sc-if></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8;">Email<input type="email" value="{{enq.email}}" onChange="{{enqSet.email}}" placeholder="Optional" style="min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #0A0612; color: #FFFFFF; font-size: 16px; font-family: inherit; width: 100%; box-sizing: border-box;"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8;">City<input type="text" value="{{enq.city}}" onChange="{{enqSet.city}}" placeholder="e.g. Chennai" style="min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #0A0612; color: #FFFFFF; font-size: 16px; font-family: inherit; width: 100%; box-sizing: border-box;"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8; grid-column: 1 / -1;">I am enquiring for
<span style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{enqTypes}}" as="t" hint-placeholder-count="4"><button type="button" onClick="{{t.pick}}" aria-pressed="{{t.active}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid {{t.border}}; background: {{t.bg}}; color: #FFFFFF; font-size: 15px; font-weight: 500; cursor: pointer;">{{t.label}}</button></sc-for>
</span></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8; grid-column: 1 / -1;">Products / box interested in<input type="text" value="{{enq.product}}" onChange="{{enqSet.product}}" placeholder="e.g. Family Box ₹1000, sparklers" style="min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #0A0612; color: #FFFFFF; font-size: 16px; font-family: inherit; width: 100%; box-sizing: border-box;"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #C9C3D8; grid-column: 1 / -1;">Message<textarea rows="3" value="{{enq.message}}" onChange="{{enqSet.message}}" placeholder="Quantity, delivery date, anything else…" style="padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #0A0612; color: #FFFFFF; font-size: 16px; font-family: inherit; resize: vertical;"></textarea></label>
<button type="submit" style="grid-column: 1 / -1; min-height: 58px; border: 0; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; cursor: pointer;">Send Enquiry</button>
<p style="grid-column: 1 / -1; margin: 0; font-size: 14px; color: #B9B3C9; text-align: center;">Prefer to talk? Call [+91 00000 00000] or WhatsApp us.</p>
</form>
</sc-if>
<sc-if value="{{enqSent}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 0; text-align: center;">
<span style="width: 84px; height: 84px; border-radius: 50%; background: rgba(37,211,102,0.15); display: flex; align-items: center; justify-content: center;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#25D366" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
<h2 id="fw-enq-title" style="margin: 0; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 32px;">Thank you, {{enq.name}}!</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.5; color: #C9C3D8;">We've received your enquiry and will call you on {{enq.phone}} shortly.<br>(Demo — nothing was actually sent.)</p>
<button onClick="{{enqClose}}" style="margin-top: 8px; min-height: 52px; padding: 0 32px; border: 0; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer;">Done</button>
</div>
</sc-if>
</div>
</div>
</sc-if>
</div>
</template>
<script type="text/x-fw-logic" id="fw-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cart: {}, toast: '', menu: false, gTab: 'all', lb: -1 };
  }
  componentDidMount() { this.cartListen(); }
  componentWillUnmount() { this.cartUnlisten(); }
  cartRead() {
    try { const raw = window.localStorage.getItem('fw-cart'); if (raw) return JSON.parse(raw) || {}; } catch (e) {}
    return window.__fwCart || {};
  }
  cartWrite(cart) {
    window.__fwCart = cart;
    try { window.localStorage.setItem('fw-cart', JSON.stringify(cart)); } catch (e) {}
    this.setState({ cart: cart });
  }
  cartAdd(p, qty) {
    const cart = Object.assign({}, this.cartRead());
    const cur = cart[p.name];
    cart[p.name] = { name: p.name, img: p.img, price: p.price, qty: (cur ? cur.qty : 0) + (qty || 1) };
    this.cartWrite(cart);
    this.showToast(p.name.split(' - ')[0] + ' added to cart');
  }
  cartSet(name, qty) {
    const cart = Object.assign({}, this.cartRead());
    if (!cart[name]) return;
    if (qty <= 0) { delete cart[name]; } else { cart[name] = Object.assign({}, cart[name], { qty: qty }); }
    this.cartWrite(cart);
  }
  cartCount() {
    const c = this.state.cart || {};
    return Object.keys(c).reduce((n, k) => n + c[k].qty, 0);
  }
  showToast(text) {
    clearTimeout(this.toastT);
    this.setState({ toast: text });
    this.toastT = setTimeout(() => this.setState({ toast: '' }), 2600);
  }
  cartListen() {
    this.setState({ cart: this.cartRead() });
    this.onStorage = (e) => { if (!e || e.key === 'fw-cart') this.setState({ cart: this.cartRead() }); };
    this.onVis = () => this.setState({ cart: this.cartRead() });
    window.addEventListener('storage', this.onStorage);
    window.addEventListener('focus', this.onVis);
    document.addEventListener('visibilitychange', this.onVis);
  }
  cartUnlisten() {
    window.removeEventListener('storage', this.onStorage);
    window.removeEventListener('focus', this.onVis);
    document.removeEventListener('visibilitychange', this.onVis);
    clearTimeout(this.toastT);
  }
  openEnquiry(product, type) {
    this.setState({
      enqOpen: true, enqSent: false, enqTried: false,
      enq: Object.assign({ name: '', phone: '', email: '', city: '', product: '', message: '', type: 'Retail purchase' }, this.state.enq || {}, { product: product || (this.state.enq && this.state.enq.product) || '', type: type || (this.state.enq && this.state.enq.type) || 'Retail purchase' })
    });
  }
  enqVals() {
    const enq = this.state.enq || { name: '', phone: '', email: '', city: '', product: '', message: '', type: 'Retail purchase' };
    const tried = this.state.enqTried;
    const nameBad = tried && enq.name.trim().length < 2;
    const phoneBad = tried && enq.phone.replace(/\D/g, '').length < 10;
    const set = {};
    ['name', 'phone', 'email', 'city', 'product', 'message'].forEach((k) => {
      set[k] = (e) => this.setState({ enq: Object.assign({}, this.state.enq || enq, { [k]: e.target.value }) });
    });
    const types = ['Retail purchase', 'Bulk / dealer', 'Corporate gifting', 'Wedding / event'];
    return {
      enqOpen: !!this.state.enqOpen,
      enqSent: !!this.state.enqSent,
      enqNotSent: !this.state.enqSent,
      enq: enq,
      enqSet: set,
      enqErr: {
        name: nameBad, nameMsg: 'Please enter your name', nameBorder: nameBad ? '#FF8A9B' : 'rgba(255,255,255,0.2)',
        phone: phoneBad, phoneMsg: 'Please enter a 10-digit phone number', phoneBorder: phoneBad ? '#FF8A9B' : 'rgba(255,255,255,0.2)'
      },
      enqTypes: types.map((t) => ({
        label: t, active: enq.type === t,
        bg: enq.type === t ? (this.props.accent ?? '#E3112F') : 'transparent',
        border: enq.type === t ? (this.props.accent ?? '#E3112F') : 'rgba(255,255,255,0.25)',
        pick: () => this.setState({ enq: Object.assign({}, enq, { type: t }) })
      })),
      enqClose: () => this.setState({ enqOpen: false, enqTried: false, enqSent: false, enq: this.state.enqSent ? null : this.state.enq }),
      enqSubmit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const ok = enq.name.trim().length >= 2 && enq.phone.replace(/\D/g, '').length >= 10;
        this.setState(ok ? { enqSent: true, enqTried: false } : { enqTried: true });
      },
      openEnq: (e) => { if (e && e.preventDefault) e.preventDefault(); this.openEnquiry(); }
    };
  }
  renderVals() {
    const items = [
      { type: 'video', src: 'assets/video/hero-banner.mp4', thumb: 'assets/images/multi-colour-bursts.png', cap: 'Sky shot display (video)', tag: 'videos' },
      { type: 'img', src: 'assets/images/golden-fountain.png', cap: 'Golden shower fountain', tag: 'products' },
      { type: 'img', src: 'assets/images/sparkler-hand.png', cap: 'Sparkler night', tag: 'festival' },
      { type: 'img', src: 'assets/images/golden-sky-burst.png', cap: 'Golden sky burst', tag: 'products' },
      { type: 'img', src: 'assets/images/fireworks-over-city.png', cap: 'Diwali over the city', tag: 'festival' },
      { type: 'img', src: 'assets/images/garland-crackers.png', cap: 'Garland crackers', tag: 'products' },
      { type: 'img', src: 'assets/images/colour-fountain.png', cap: 'Colour fountain', tag: 'products' },
      { type: 'img', src: 'assets/images/gold-sparklers.png', cap: 'Gold sparklers', tag: 'products' },
      { type: 'img', src: 'assets/images/multi-colour-bursts.png', cap: 'Multi-colour bursts', tag: 'festival' },
      { type: 'img', src: 'assets/images/festive-crackers.png', cap: 'Festive crackers', tag: 'products' },
      { type: 'img', src: 'assets/images/flower-pot-candles.png', cap: 'Flower pot candles', tag: 'products' },
      { type: 'img', src: 'assets/images/kids-fancy-icons.png', cap: 'Kids fancy range', tag: 'products' },
      { type: 'img', src: 'assets/images/red-bomb.png', cap: 'Red bomb', tag: 'products' }
    ];
    const tabs = [['all', 'All'], ['products', 'Products'], ['festival', 'Festival moments'], ['videos', 'Videos']];
    const tab = this.state.gTab;
    const shown = items.filter((it) => tab === 'all' || it.tag === tab);
    const accent = this.props.accent ?? '#E3112F';
    const idx = this.state.lb;
    const cur = idx >= 0 && idx < shown.length ? shown[idx] : null;
    return {
      ...this.enqVals(),
      cartCount: this.cartCount(),
      hasCart: this.cartCount() > 0,
      toastOn: !!this.state.toast,
      toastText: this.state.toast || '',
      menuOpen: !!this.state.menu,
      toggleMenu: () => this.setState({ menu: !this.state.menu }),
      brand: this.props.brand ?? 'Your Brand',
      accent: this.props.accent ?? '#E3112F',
      gTabs: tabs.map((t) => ({ label: t[1], active: tab === t[0], bg: tab === t[0] ? accent : 'transparent', border: tab === t[0] ? accent : 'rgba(255,255,255,0.25)', pick: () => this.setState({ gTab: t[0], lb: -1 }) })),
      gItems: shown.map((it, i) => ({ cap: it.cap, thumb: it.thumb || it.src, isVideo: it.type === 'video', open: () => this.setState({ lb: i }) })),
      lbOpen: !!cur,
      lb: cur ? { src: cur.src, cap: cur.cap, isVideo: cur.type === 'video', isImage: cur.type !== 'video', pos: (idx + 1) + ' / ' + shown.length } : { src: '', cap: '', isVideo: false, isImage: true, pos: '' },
      lbClose: () => this.setState({ lb: -1 }),
      lbPrev: () => this.setState({ lb: (idx - 1 + shown.length) % shown.length }),
      lbNext: () => this.setState({ lb: (idx + 1) % shown.length }),
    };
  }
}
</script>
<script src="js/react.production.min.js"></script>
<script src="js/react-dom.production.min.js"></script>
<script src="js/fw-runtime.js"></script>
</body>
</html>
